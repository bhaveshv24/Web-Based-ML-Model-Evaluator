name: CI

on:
  push:
  pull_request:

jobs:
  core-tests:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: ruff check backend tests sandbox
      - run: python manage.py makemigrations --check --dry-run
      - run: pytest --cov=backend --cov-report=term-missing --cov-report=xml --cov-fail-under=80
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  # Real-container containment suite (IT-EXE-04/05, ST-SEC-07/08, ST-EXE-02).
  sandbox-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: docker build -t ml-evaluator-sandbox:1.0 sandbox/
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      # Security evidence must actually execute: a skip or an empty selection fails the job.
      - name: Hostile-model containment suite
        env:
          REQUIRE_DOCKER_TESTS: "1"
        run: |
          set -o pipefail
          pytest -m docker -v -rs -p no:cacheprovider | tee docker-tests.log
          if grep -E "SKIPPED|skipped|no tests ran" docker-tests.log; then
            echo "Docker security tests were skipped; failing." >&2
            exit 1
          fi
      - name: No sandbox containers left behind
        run: test -z "$(docker ps -aq --filter label=ml-evaluator.job)"

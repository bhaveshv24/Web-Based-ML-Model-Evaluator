name: CI

on:
  push:
  pull_request:

jobs:
  core-tests:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      REDIS_URL: redis://localhost:6379/0
      REQUIRE_REDIS_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: ruff check backend tests sandbox
      - run: python manage.py makemigrations --check --dry-run
      - run: pytest --cov=backend --cov-report=term-missing --cov-report=xml --cov-fail-under=80
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  # Real-container containment suite (IT-EXE-04/05, ST-SEC-07/08, ST-EXE-02).
  sandbox-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: docker build -t ml-evaluator-sandbox:1.0 sandbox/
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      # Security evidence must actually execute: a skip or an empty selection fails the job.
      - name: Hostile-model containment suite
        env:
          REQUIRE_DOCKER_TESTS: "1"
        run: |
          set -o pipefail
          pytest -m docker -v -rs -p no:cacheprovider | tee docker-tests.log
          if grep -E "SKIPPED|skipped|no tests ran" docker-tests.log; then
            echo "Docker security tests were skipped; failing." >&2
            exit 1
          fi
      - name: Upload containment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sandbox-containment-log
          path: docker-tests.log
      - name: No sandbox containers left behind
        run: test -z "$(docker ps -aq --filter label=ml-evaluator.job)"

  # ST-SEC-12 (SEC-009): dependency and static-analysis scan on every push.
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip setuptools
      - run: python -m pip install -e '.[dev,runtime]' pip-audit bandit
      - name: Dependency scan (project and sandbox image)
        run: |
          pip-audit --skip-editable
          pip-audit -r sandbox/requirements.txt
      - name: Static analysis (fails on medium or high severity)
        run: bandit -r backend sandbox -x '*/migrations/*' -ll

  # PORT-01 (NFR-008): a fresh `docker compose up` on Linux reaches a working API and runs
  # one evaluation through the real sandbox.
  compose-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Configure secrets and the sandbox job directory
        run: |
          python - <<'PY'
          import secrets
          s = open(".env.example").read()
          s = s.replace("replace-with-a-long-random-value", secrets.token_urlsafe(48))
          s = s.replace("replace-with-a-random-database-password", secrets.token_urlsafe(24))
          open(".env", "w").write(s)
          PY
          sudo install -d -m 0711 -o 10002 -g 10002 /var/lib/ml-evaluator/jobs
      - run: docker compose --profile sandbox build sandbox
      - run: docker compose up -d --build
      - name: Wait for the API
        run: |
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/api/v1/evaluations || true)
            [ "$code" = 401 ] && echo "API ready after $((i*2)) s" && exit 0
            sleep 2
          done
          docker compose logs; exit 1
      - run: python -m pip install -e '.[dev]'
      - name: Smoke test (register, upload, validate, evaluate in the sandbox)
        run: |
          python scripts/validation/system_tests.py \
            --only "ST-AUTH-01(API),ST-ING-01(API),ST-EXE-01(API)" \
            --out compose-smoke.json
      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compose-smoke
          path: compose-smoke.json
      - if: always()
        run: docker compose logs --no-color > compose.log; docker compose down -v

name: CI

on:
  push:
  pull_request:

jobs:
  core-tests:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      REDIS_URL: redis://localhost:6379/0
      REQUIRE_REDIS_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip setuptools
      - run: python -m pip install -e '.[dev]'
      - run: ruff check backend tests sandbox scripts
      - run: bandit -r backend sandbox -q -lll -ii
      - run: pip-audit --progress-spinner off --skip-editable
      - run: python manage.py makemigrations --check --dry-run
      # TSMP-22: RTM, defect register and reports cite only files, tests and defects that exist.
      - run: python scripts/validation/check_rtm.py
      - run: pytest --cov=backend --cov-branch --cov-report=term-missing --cov-report=xml --cov-report=html --junitxml=junit.xml --cov-fail-under=80
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: |
            coverage.xml
            htmlcov/
            junit.xml

  # Real-container containment suite (IT-EXE-04/05, ST-SEC-07/08, ST-EXE-02).
  sandbox-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: docker build -t ml-evaluator-sandbox:1.0 sandbox/
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      # Security evidence must actually execute: a skip or an empty selection fails the job.
      - name: Hostile-model containment suite
        env:
          REQUIRE_DOCKER_TESTS: "1"
        run: |
          set -o pipefail
          pytest -m docker -v -rs -p no:cacheprovider | tee docker-tests.log
          if grep -E "SKIPPED|skipped|no tests ran" docker-tests.log; then
            echo "Docker security tests were skipped; failing." >&2
            exit 1
          fi
      - name: Upload containment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sandbox-containment-log
          path: docker-tests.log
      - name: No sandbox containers left behind
        run: test -z "$(docker ps -aq --filter label=ml-evaluator.job)"

  # ST-SEC-12 (SEC-009): dependency and static-analysis scan on every push.
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the secret scan reads the whole history
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip setuptools
      - run: python -m pip install -e '.[dev,runtime]' pip-audit bandit
      - name: Dependency scan (project and sandbox image)
        run: |
          pip-audit --skip-editable
          pip-audit -r sandbox/requirements.txt
      - name: Static analysis (fails on medium or high severity)
        run: bandit -r backend sandbox -x '*/migrations/*' -ll
      - name: Secret scan of the full Git history (SEC-009, never committed)
        run: |
          docker run --rm -v "$PWD:/repo:ro" zricethezav/gitleaks:v8.18.4 \
            detect --source /repo --log-opts=--all --redact --no-banner

  # PORT-01 (NFR-008): a fresh `docker compose up` on Linux reaches a working API and runs
  # one evaluation through the real sandbox.
  compose-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Configure secrets and the sandbox job directory
        run: |
          python - <<'PY'
          import secrets
          s = open(".env.example").read()
          s = s.replace("replace-with-a-long-random-value", secrets.token_urlsafe(48))
          s = s.replace("replace-with-a-random-database-password", secrets.token_urlsafe(24))
          open(".env", "w").write(s)
          PY
          sudo install -d -m 0711 -o 10002 -g 10002 /var/lib/ml-evaluator/jobs
      - run: python -m pip install -e '.[dev]'
      # Same script a teammate runs on Windows or macOS: preflight, build, start, smoke cases.
      - name: PORT-01 portability check (preflight, compose up, smoke in the sandbox)
        run: python scripts/validation/portability_check.py --up --smoke --out compose-smoke.json
      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compose-smoke
          path: compose-smoke.json
      - if: always()
        run: docker compose logs --no-color > compose.log; docker compose down -v

  # The validation tools a teammate runs on their own machine (RTM checker, portability check,
  # availability probe) must work on Windows and macOS too. This is NOT PORT-01: GitHub's
  # Windows and macOS runners cannot run the Linux containers of the Compose stack.
  tooling-cross-os:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python scripts/validation/check_rtm.py
      - run: python scripts/validation/portability_check.py --help
      - run: python scripts/validation/availability_probe.py --help
      - run: python -m compileall -q scripts

  frontend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev

  sonarqube:
    runs-on: ubuntu-latest
    needs: core-tests
    steps:
      - name: Start isolated SonarQube with its kernel prerequisite
        run: |
          sudo sysctl -w vm.max_map_count=524288
          docker run -d --name team13-sonarqube -p 127.0.0.1:9000:9000 \
            sonarqube:community@sha256:1ce197471f5f2bac347694a336862fd2c23e9f57c6edb46acebbfbe70f2c7d9c
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          name: coverage-xml
      - name: Make coverage source paths portable
        run: |
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          path = Path("coverage.xml")
          tree = ET.parse(path)
          for source in tree.findall("sources/source"):
              source.text = "backend"
          tree.write(path, encoding="unicode")
          PY
      - name: Configure isolated quality gate
        run: python scripts/validation/sonarqube_gate.py setup --credentials "$RUNNER_TEMP/sonar-auth.json" --env-file "$RUNNER_TEMP/sonar.env"
      - name: Analyze and enforce zero blocker or critical findings
        run: |
          docker run --rm --network host --user "$(id -u):$(id -g)" \
            --env-file "$RUNNER_TEMP/sonar.env" -e SONAR_USER_HOME=/tmp/.sonar \
            -e SONAR_SCANNER_JAVA_OPTS=-Xmx384m \
            -v "$PWD:/usr/src" sonarsource/sonar-scanner-cli:latest@sha256:38207bba3d98c8ce6f6c051ea2b9f05a24480da78c9ee5945ceafc3d9de02b88 \
            -Dsonar.working.directory=/tmp/sonar-work -Dsonar.javascript.node.maxspace=1024 \
            -Dsonar.python.coverage.reportPaths=coverage.xml
      - name: Save quality gate evidence
        if: always()
        run: python scripts/validation/sonarqube_gate.py report --credentials "$RUNNER_TEMP/sonar-auth.json" --out sonar-quality-gate.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sonar-quality-gate
          path: sonar-quality-gate.json
      - name: Stop isolated quality server
        if: always()
        run: docker rm -fv team13-sonarqube

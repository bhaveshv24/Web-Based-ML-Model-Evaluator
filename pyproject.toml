[project]
name = "web-based-ml-model-evaluator"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6"]
runtime = [
  "Django>=5.1,<5.2",
  "djangorestframework>=3.15,<3.16",
  "djangorestframework-simplejwt>=5.3,<5.4",
  "celery>=5.4,<5.5",
  "redis>=5.0,<6",
  "psycopg[binary]>=3.2,<3.3",
  "pandas>=2.2,<2.3",
  "scikit-learn>=1.5,<1.6",
  "onnxruntime>=1.19,<1.20",
  "reportlab>=4.2,<4.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend"]
addopts = "--strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]


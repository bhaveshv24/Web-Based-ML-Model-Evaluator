[project]
name = "web-based-ml-model-evaluator"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "Django>=5.1,<5.2",
  "djangorestframework>=3.15,<3.16",
  "djangorestframework-simplejwt>=5.3,<5.4",
  "celery>=5.4,<5.5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "pytest-django>=4.9",
  "ruff>=0.6",
  # M3 tests: Docker SDK types for the sandbox policy, real models for the runner and
  # scikit-learn cross-checks of the trusted metric engine, Redis for the async E2E test.
  "docker>=7.1,<8",
  "redis>=5.0,<6",
  "scikit-learn>=1.5,<1.6",
  "pandas>=2.2,<2.3",
  "onnxruntime>=1.19,<1.20",
  # Test-only: builds ONNX fixtures. onnx>=1.22 includes all published security fixes.
  "onnx>=1.22,<2",
  "skl2onnx>=1.20,<1.21",
]
runtime = [
  "celery>=5.4,<5.5",
  "redis>=5.0,<6",
  "psycopg[binary]>=3.2,<3.3",
  "pandas>=2.2,<2.3",
  "scikit-learn>=1.5,<1.6",
  "onnxruntime>=1.19,<1.20",
  "reportlab>=4.2,<4.3",
  "docker>=7.1,<8",
]

[tool.setuptools.packages.find]
# Only the Django backend is packaged; sandbox/ holds the container image sources.
include = ["backend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend"]
addopts = "--strict-markers"
markers = [
  "docker: needs a Docker daemon and the sandbox image (skipped when unavailable)",
  "redis: needs a reachable Redis broker (skipped when unavailable)",
]
DJANGO_SETTINGS_MODULE = "config.settings"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["**/migrations/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]


[project]
name = "web-based-ml-model-evaluator"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  # Patched Django 5.2 LTS floor shared with main.
  "Django>=5.2.19,<5.3",
  "djangorestframework>=3.18.2,<3.19",
  "djangorestframework-simplejwt>=5.5.1,<5.6",
  "celery>=5.4,<5.5",
  # Kombu 5.7 can leave a Celery 5.4 Redis worker stuck during shutdown.
  "kombu>=5.6,<5.7",
  "reportlab>=4.2,<4.3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "pytest-django>=4.9",
  "ruff>=0.6",
  "bandit>=1.9,<2",
  "pip-audit>=2.10,<3",
  "pypdf>=6,<7",
  # M3 tests: Docker SDK types for the sandbox policy, real models for the runner and
  # scikit-learn cross-checks of the trusted metric engine, Redis for the async E2E test.
  "docker>=7.1,<8",
  "redis>=6.1,<7",
  "scikit-learn>=1.5,<1.6",
  "pandas>=2.2,<2.3",
  "onnxruntime>=1.19,<1.20",
  # Test-only: builds ONNX fixtures. onnx>=1.22 includes all published security fixes.
  "onnx>=1.22,<2",
  "skl2onnx>=1.20,<1.21",
  "requests>=2.31",
]
runtime = [
  "redis>=6.1,<7",
  "psycopg[binary]>=3.2,<3.3",
  "docker>=7.1,<8",
  "gunicorn>=23,<24",
]

[tool.setuptools.packages.find]
# Only the Django backend is packaged; sandbox/ holds the container image sources.
include = ["backend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend"]
addopts = "--strict-markers"
markers = [
  "docker: needs a Docker daemon and the sandbox image (skipped when unavailable)",
  "redis: needs a reachable Redis broker (skipped when unavailable)",
]
DJANGO_SETTINGS_MODULE = "config.settings"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["**/migrations/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
[tool.setuptools.package-data]
"backend.benchmarking" = ["dashboard/*"]
